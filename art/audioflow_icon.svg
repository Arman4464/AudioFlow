<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sharp Neo-Brutalist Drop Shadow Filter -->
    <filter id="brutal-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="14" dy="14" stdDeviation="0" flood-color="#121212" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Neo-Brutal Canvas Background -->
  <!-- Hard offset base shadow -->
  <rect x="22" y="22" width="476" height="476" rx="100" fill="#121212"/>
  <!-- Front Canvas: Bold Cream / Electric Base -->
  <rect x="12" y="12" width="476" height="476" rx="100" fill="#FFFDF5" stroke="#121212" stroke-width="10"/>

  <!-- Centered Dynamic AudioFlow Group (-35deg rotation) -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)">

    <!-- ========================================================== -->
    <!-- 1. ACOUSTIC SOUNDWAVE CONDUITS (Expanding Flow Arcs)       -->
    <!-- ========================================================== -->

    <!-- Outer Wave (Hot Pink #FF2A85) -->
    <path d="M 370 120 A 180 180 0 0 1 370 392" fill="none" stroke="#121212" stroke-width="36" stroke-linecap="round" transform="translate(8, 8)"/>
    <path d="M 370 120 A 180 180 0 0 1 370 392" fill="none" stroke="#121212" stroke-width="34" stroke-linecap="round"/>
    <path d="M 370 120 A 180 180 0 0 1 370 392" fill="none" stroke="#FF2A85" stroke-width="20" stroke-linecap="round"/>

    <!-- Middle Wave (Mint Green #00FF88) -->
    <path d="M 322 155 A 125 125 0 0 1 322 357" fill="none" stroke="#121212" stroke-width="34" stroke-linecap="round" transform="translate(8, 8)"/>
    <path d="M 322 155 A 125 125 0 0 1 322 357" fill="none" stroke="#121212" stroke-width="32" stroke-linecap="round"/>
    <path d="M 322 155 A 125 125 0 0 1 322 357" fill="none" stroke="#00FF88" stroke-width="18" stroke-linecap="round"/>

    <!-- Inner Wave (Electric Cyan #00F0FF) -->
    <path d="M 274 190 A 72 72 0 0 1 274 322" fill="none" stroke="#121212" stroke-width="32" stroke-linecap="round" transform="translate(8, 8)"/>
    <path d="M 274 190 A 72 72 0 0 1 274 322" fill="none" stroke="#121212" stroke-width="30" stroke-linecap="round"/>
    <path d="M 274 190 A 72 72 0 0 1 274 322" fill="none" stroke="#00F0FF" stroke-width="16" stroke-linecap="round"/>

    <!-- ========================================================== -->
    <!-- 2. CHUNKY NEO-BRUTALIST AUDIO PLUG                         -->
    <!-- ========================================================== -->

    <!-- Hard Offset Shadow for the Entire Plug -->
    <g transform="translate(12, 12)">
      <rect x="52" y="228" width="46" height="56" rx="10" fill="#121212"/>
      <rect x="98" y="212" width="80" height="88" rx="14" fill="#121212"/>
      <rect x="178" y="222" width="76" height="68" fill="#121212"/>
      <path d="M 254 222 L 288 238 Q 308 256 288 274 L 254 290 Z" fill="#121212"/>
    </g>

    <!-- Cable Boot (Dark Charcoal #1E202B) -->
    <rect x="52" y="228" width="46" height="56" rx="10" fill="#1E202B" stroke="#121212" stroke-width="9"/>

    <!-- Main Barrel (Vivid Yellow #FFD93D) -->
    <rect x="98" y="212" width="80" height="88" rx="14" fill="#FFD93D" stroke="#121212" stroke-width="9"/>
    <!-- Barrel Ridges -->
    <line x1="124" y1="228" x2="124" y2="284" stroke="#121212" stroke-width="6" stroke-linecap="round"/>
    <line x1="146" y1="228" x2="146" y2="284" stroke="#121212" stroke-width="6" stroke-linecap="round"/>

    <!-- Shaft Contact (Chrome Silver #FFFFFF) -->
    <rect x="178" y="222" width="48" height="68" fill="#FFFFFF" stroke="#121212" stroke-width="9"/>

    <!-- Insulator Ring Notch (Solid Heavy Black #121212) -->
    <rect x="226" y="222" width="18" height="68" fill="#121212"/>

    <!-- Bullet Tip (Vivid Gold #FFD93D) -->
    <path d="M 244 222 L 288 238 Q 308 256 288 274 L 244 290 Z" fill="#FFD93D" stroke="#121212" stroke-width="9"/>

  </g>

  <!-- ========================================================== -->
  <!-- 3. POP-ART TACTILE SPARKS & SOUND NODES                    -->
  <!-- ========================================================== -->
  <!-- Top Spark (Vivid Yellow) -->
  <g transform="translate(390, 80)">
    <polygon points="0,-24 8,-8 24,0 8,8 0,24 -8,8 -24,0 -8,-8" fill="#FFD93D" stroke="#121212" stroke-width="5"/>
  </g>

  <!-- Bottom Node (Electric Cyan) -->
  <circle cx="106" cy="406" r="16" fill="#00F0FF" stroke="#121212" stroke-width="6"/>
  <circle cx="106" cy="406" r="5" fill="#121212"/>
</svg>
