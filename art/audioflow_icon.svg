<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sharp Neo-Brutalist Drop Shadow Filter -->
    <filter id="brutal-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="14" dy="14" stdDeviation="0" flood-color="#121212" flood-opacity="1" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="112" fill="#0D0E15"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#FFE169" stroke-width="8"/>

  <!-- Subtle Brutalist Accent Grid -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="2">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- Dynamic Routing Conduits (Sound Waves) -->
  <!-- Wave 1 (Outer Pink) -->
  <path d="M 330 140 A 170 170 0 0 1 330 372" fill="none" stroke="#121212" stroke-width="32" stroke-linecap="round"/>
  <path d="M 330 140 A 170 170 0 0 1 330 372" fill="none" stroke="#FF2A85" stroke-width="20" stroke-linecap="round"/>

  <!-- Wave 2 (Middle Mint) -->
  <path d="M 285 175 A 115 115 0 0 1 285 337" fill="none" stroke="#121212" stroke-width="28" stroke-linecap="round"/>
  <path d="M 285 175 A 115 115 0 0 1 285 337" fill="none" stroke="#00FF88" stroke-width="18" stroke-linecap="round"/>

  <!-- Wave 3 (Inner Cyan) -->
  <path d="M 240 212 A 62 62 0 0 1 240 300" fill="none" stroke="#121212" stroke-width="24" stroke-linecap="round"/>
  <path d="M 240 212 A 62 62 0 0 1 240 300" fill="none" stroke="#00F0FF" stroke-width="16" stroke-linecap="round"/>

  <!-- Central Audio Jack Body (Hardware Plug) -->
  <g transform="translate(14, 0)">
    <!-- Base Cable Stem -->
    <rect x="70" y="240" width="46" height="32" rx="6" fill="#1E202B" stroke="#121212" stroke-width="8"/>
    
    <!-- Jack Collar / Barrel -->
    <rect x="110" y="228" width="60" height="56" rx="8" fill="#FFE169" stroke="#121212" stroke-width="8"/>
    <!-- Collar Grip Ridges -->
    <line x1="126" y1="234" x2="126" y2="278" stroke="#121212" stroke-width="4"/>
    <line x1="140" y1="234" x2="140" y2="278" stroke="#121212" stroke-width="4"/>
    <line x1="154" y1="234" x2="154" y2="278" stroke="#121212" stroke-width="4"/>

    <!-- Shaft Sleeve (Ground) -->
    <rect x="170" y="238" width="30" height="36" fill="#D6D8E1" stroke="#121212" stroke-width="7"/>
    <!-- Insulator Ring 1 -->
    <rect x="200" y="238" width="7" height="36" fill="#121212"/>
    <!-- Ring Segment (Right Channel) -->
    <rect x="207" y="238" width="24" height="36" fill="#FFE169" stroke="#121212" stroke-width="7"/>
    <!-- Insulator Ring 2 -->
    <rect x="231" y="238" width="7" height="36" fill="#121212"/>
    <!-- Tip Segment (Left Channel) -->
    <path d="M 238 238 L 268 244 Q 284 256 268 268 L 238 274 Z" fill="#FFE169" stroke="#121212" stroke-width="7"/>
  </g>

  <!-- High-Energy Audio Sparks -->
  <polygon points="360,110 375,135 348,135" fill="#FFE169" stroke="#121212" stroke-width="4"/>
  <polygon points="390,360 405,385 378,385" fill="#00F0FF" stroke="#121212" stroke-width="4"/>
  <circle cx="196" cy="144" r="8" fill="#00FF88" stroke="#121212" stroke-width="3"/>
  <circle cx="160" cy="380" r="10" fill="#FF2A85" stroke="#121212" stroke-width="4"/>
</svg>
